name: Publish project
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ !contains(github.event.head_commit.message, '[publish-unpacked]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        shell: bash
        run: |
          ARCHIVE=".publish/CivitaiRed_Browser_1.3.1.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Archive not found, nothing to unpack."
            exit 0
          fi
          unzip -o "$ARCHIVE" -d .
          rm -rf .publish
          rm -f .github/workflows/publish-unpack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: publish Civitai Red Browser 1.3.1 [publish-unpacked]"
          git push
